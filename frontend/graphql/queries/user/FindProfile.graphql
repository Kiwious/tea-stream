query FindProfile {
	findProfile {
		id
		username
		email
		displayName
		avatar
		bio
		isVerified
		isTotpEnabled
		notificationSettings {
			siteNotifications
			telegramNotifications
		}
		stream {
			streamKey
			serverUrl
			isChatEnabled
			isChatFollowersOnly
			isChatPremiumFollowersOnly
		}
	}
}
