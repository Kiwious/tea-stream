query FindChannelByUsername($username: String!) {
	findChannelByUsername(username: $username) {
		id
		displayName
		username
		avatar
		isVerified
		bio
		stream {
			id
			title
			thumbnailUrl
			isLive
			category {
				id
				title
			}
			isChatEnabled
			isChatFollowersOnly
			isChatPremiumFollowersOnly
		}
		sponsorshipPlans {
			id
			title
			description
			price
		}
		followers {
			id
		}
		socialLinks {
			title
			url
		}
	}
}
