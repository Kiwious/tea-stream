name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time on the small server
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/yarn.lock
      # prisma generate (postinstall) only needs a syntactically valid URL
      - run: yarn install --frozen-lockfile
        env:
          POSTGRES_URI: postgresql://ci:ci@localhost:5432/ci
      - run: yarn build

  check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      # Generates route types like LayoutProps into .next/types (normally done by next dev/build)
      - run: bunx next typegen
      - run: bunx tsc --noEmit

  deploy:
    needs: [check-backend, check-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on server
        run: |
          ssh -o ServerAliveInterval=30 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && bash deploy.sh"
