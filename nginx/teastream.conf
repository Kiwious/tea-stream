# Copy to /etc/nginx/sites-available/teastream and replace example.com.
# certbot --nginx adds the HTTPS server block and the http -> https redirect.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name example.com www.example.com;

	# The API only allows the apex origin, so www must not serve the app
	if ($host = www.example.com) {
		return 301 https://example.com$request_uri;
	}

	client_max_body_size 20m;

	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location /graphql {
		proxy_pass http://127.0.0.1:4000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 1h;
	}

	location /webhook/ {
		proxy_pass http://127.0.0.1:4000;
	}

	location / {
		proxy_pass http://127.0.0.1:3000;
	}
}
