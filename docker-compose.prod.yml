services:
  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql
    # Localhost only, reachable from outside via SSH tunnel (Prisma Studio)
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teastream

  redis:
    image: redis:8
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teastream

  backend:
    build: ./backend
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - APPLICATION_PORT=4000
      - APPLICATION_URL=https://${DOMAIN}
      - ALLOWED_ORIGIN=https://${DOMAIN}
      - GRAPHQL_PREFIX=/graphql
      - SESSION_NAME=session
      - SESSION_DOMAIN=${DOMAIN}
      - SESSION_SECURE=true
      - SESSION_HTTP_ONLY=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/graphql').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - 127.0.0.1:4000:4000
    networks:
      - teastream

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_APP_URL=https://${DOMAIN}
        - NEXT_PUBLIC_SERVER_URL=https://${DOMAIN}/graphql
        - NEXT_PUBLIC_WEBSOCKET_URL=wss://${DOMAIN}/graphql
        - NEXT_PUBLIC_MEDIA_URL=${MEDIA_URL}
        - NEXT_PUBLIC_LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
    restart: always
    depends_on:
      - backend
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - teastream

volumes:
  postgres_data:
  redis_data:

networks:
  teastream:
